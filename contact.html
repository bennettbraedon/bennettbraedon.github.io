    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Raleway:wght@600;700&display=swap"

<body>
  <nav>
    <p>Braedon Bennett</p>
    <p>
      <a href="index.html">About Braedon Bennett</a>
    </p>
  </nav>

  <section class="contact-container">
    <h1>Contact Braedon</h1>

    <p class="contact-intro">
      2451 Peak Ridge Ln, Gainesville, GA 30504 &nbsp;|&nbsp; (706) 809-7276 &nbsp;|&nbsp; bennettbraedon@gmail.com
    </p>
    <p class="contact-intro">
      I am a third-year accounting student looking for a 2026 summer internship.
    </p>
    <hr />
  </section>

  <section class="form-wrap">
    <!-- If using formsubmit.co, consider adding a _next parameter to control the thank-you redirect -->
    <form
      action="https://formsubmit.co/beb97080@uga.edu"
      method="POST"
      class="form-grid"
    >
      <!-- Recommended hidden inputs -->
      <input type="hidden" name="_subject" value="New message from your portfolio site" />
      <input type="hidden" name="_template" value="table" />
      <!-- Optional redirect after submit -->
      <!-- <input type="hidden" name="_next" value="https://YOUR_USERNAME.github.io/YOUR_REPO/thanks.html" /> -->

      <label for="name">Name</label>
      <input id="name" type="text" name="name" placeholder="Your full name" required />

      <label for="email">Email</label>
      <input id="email" type="email" name="email" placeholder="email@example.com" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" placeholder="How can I help?" required></textarea>

      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
